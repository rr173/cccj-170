[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pagestore-txn"
version = "1.0.0"
description = "Stdlib-only page-based transactional storage with crash recovery"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
pagestore = "pagestore.cli:main"

[tool.setuptools]
packages = ["pagestore"]
